[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regexlab"
version = "0.1.0"
description = "Test regular expressions against text and files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BYREX"}]
dependencies = []

[project.scripts]
regexlab = "regexlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
